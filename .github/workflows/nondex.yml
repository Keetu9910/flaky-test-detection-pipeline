name: Run NonDex
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      force_java_version:
        required: false
        type: string
      max_job_timeout:
        required: true
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      # The target repo owns the workspace root, so the shared actions live in a hidden sub-folder.
      - name: Checkout Pipeline Actions
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Set up Java Environment
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version-file: '${{ github.workspace }}/${{ inputs.module_path }}/pom.xml'
          java-version: '8'

      - name: Save Run Metadata
        uses: ./.pipeline-tools/.github/actions/save-metadata
        with:
          repo-url: ${{ inputs.repo_url }}
          sha: ${{ inputs.sha }}
          module-path: ${{ inputs.module_path }}

      - name: Run NonDex
        continue-on-error: true
        uses: ./.pipeline-tools/.github/actions/run-detector
        with:
          tool: nondex
          module-path: ${{ inputs.module_path }}
          mvn-args: edu.illinois.cs:nondex-maven-plugin:2.1.7:nondex

      - name: Archive NonDex Results and Logs
        if: always()
        uses: ./.pipeline-tools/.github/actions/archive-results
        with:
          tool: nondex
          repo-name: ${{ inputs.repo_name }}
          sha: ${{ inputs.sha }}
          results-glob: '**/.nondex/**'
