name: Run NonDex
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version-file: '${{ github.workspace }}/${{ inputs.module_path }}/pom.xml'
          java-version: '8'

      - name: Save Run Metadata
        run: |
          mkdir -p .output_metadata
          cat <<EOF > .output_metadata/run_metadata.json
          {"github_url": "${{ inputs.repo_url }}", "sha": "${{ inputs.sha }}", "module_path": "${{ inputs.module_path }}"}
          EOF
          if [ "${{ inputs.module_path }}" != "." ]; then
            mkdir -p ${{ inputs.module_path }}/.output_metadata
            cp .output_metadata/run_metadata.json ${{ inputs.module_path }}/.output_metadata/run_metadata.json
          fi

      - name: Run NonDex
        continue-on-error: true
        run: |
          cd ${{ inputs.module_path }}
          mkdir -p logs
          
          mvn edu.illinois:nondex-maven-plugin:2.2.1:nondex \
            -B -DnondexRuns=10 -DnondexMode=FULL \
            -Dmaven.test.failure.ignore=true -DfailIfNoTests=false \
            -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
            -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true 2>&1 | tee >(grep -iE "error|flaky|fail|exception" > logs/nondex_filtered.log)

      - name: Archive NonDex Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nondex-results-${{ inputs.repo_name }}-${{ inputs.sha }}
          path: |
            **/run_metadata.json
            **/.nondex/**
          include-hidden-files: true
          retention-days: 7

      - name: Archive NonDex Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nondex_logs_${{ inputs.repo_name }}
          path: '**/logs/nondex_filtered.log'
          retention-days: 7
