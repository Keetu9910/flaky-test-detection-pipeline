name: Run iDFlakies
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      max_job_timeout:
        required: true
        type: string
      force_java_version:
        required: false
        type: string
      idflakies_java9plus:
        required: false
        type: boolean

jobs:
  idflakies:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      - name: Checkout Pipeline Scripts
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Setup Project Under Test
        id: setup
        uses: ./.pipeline-tools/.github/actions/setup-project
        with:
          repo_slug: ${{ inputs.repo_slug }}
          sha: ${{ inputs.sha }}
          module_path: ${{ inputs.module_path }}
          repo_url: ${{ inputs.repo_url }}
          force_java_version: ${{ inputs.force_java_version }}
          max_job_timeout: ${{ inputs.max_job_timeout }}
          build_idflakies: 'true'
          build_flakesync: 'false'

      # Runs on Java 8 always; on Java 11/17 only when idflakies_java9plus is enabled
      - name: Run iDFlakies
        if: startsWith(steps.setup.outputs.java_version, '8') || startsWith(steps.setup.outputs.java_version, '1.8') || inputs.idflakies_java9plus
        continue-on-error: true
        env:
          JOB_TIMEOUT: ${{ inputs.max_job_timeout }}
        run: |
          cd ${{ inputs.module_path }}
          mkdir -p logs
          unset MAVEN_OPTS
          mvn test-compile -q -B -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true

          # Use whatever time is left before the reserve deadline set by the setup action,
          # since dependency setup now happens inside this same job.
          if [ -n "$JOB_DEADLINE" ]; then
            REMAINING=$(( JOB_DEADLINE - $(date +%s) ))
          else
            REMAINING=$(( (JOB_TIMEOUT - 5) * 60 ))
          fi
          if [ "$REMAINING" -lt 300 ]; then
            REMAINING=300
          fi
          IDFLAKIES_TIMEOUT="${REMAINING}s"

          timeout --foreground $IDFLAKIES_TIMEOUT mvn edu.illinois.cs:idflakies-maven-plugin:2.0.0:detect \
            -B -Dstyle.color=always -Ddetector.detector_type=random-class-method \
            -Ddt.randomize.rounds=10 -Ddt.detector.original_order.all_must_pass=false \
            -Ddt.detector.original_order.retry_count=3 -Dmaven.test.failure.ignore=true \
            -DfailIfNoTests=false -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true 2>&1 | tee logs/idflakies_log.txt || true

      - name: Archive iDFlakies Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idflakies-results-${{ inputs.repo_name }}-${{ inputs.sha }}
          path: |
            **/run_metadata.json
            **/.dtfixingtools/**
          include-hidden-files: true
          retention-days: 7

      - name: Archive iDFlakies Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idflakies_logs_${{ inputs.repo_name }}
          path: '**/logs/idflakies_log.txt'
          retention-days: 7
