name: Run iDFlakies
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      max_job_timeout:
        required: true
        type: string
      force_java_version:
        required: false
        type: string
      idflakies_java9plus:
        required: false
        type: boolean

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      - name: Set up Java Environment
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version-file: '${{ github.workspace }}/${{ inputs.module_path }}/pom.xml'
          java-version: '8'

      - name: Save Run Metadata
        run: |
          mkdir -p .output_metadata
          cat <<EOF > .output_metadata/run_metadata.json
          {"github_url": "${{ inputs.repo_url }}", "sha": "${{ inputs.sha }}", "module_path": "${{ inputs.module_path }}"}
          EOF
          if [ "${{ inputs.module_path }}" != "." ]; then
            mkdir -p ${{ inputs.module_path }}/.output_metadata
            cp .output_metadata/run_metadata.json ${{ inputs.module_path }}/.output_metadata/run_metadata.json
          fi

      - name: Run iDFlakies
        if: startsWith(steps.setup-java.outputs.version, '8') || startsWith(steps.setup-java.outputs.version, '1.8')
        continue-on-error: true
        run: |
          cd ${{ inputs.module_path }}
          mkdir -p logs
          unset MAVEN_OPTS
          mvn test-compile -q -B -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          
          JOB_TIMEOUT=${{ inputs.max_job_timeout }}
          IDFLAKIES_TIMEOUT=$(( JOB_TIMEOUT > 5 ? JOB_TIMEOUT - 5 : 5 ))m
          
          timeout --foreground $IDFLAKIES_TIMEOUT mvn edu.illinois.cs:idflakies-maven-plugin:2.0.0:detect \
            -B -Dstyle.color=always -Ddetector.detector_type=random-class-method \
            -Ddt.randomize.rounds=10 -Ddt.detector.original_order.all_must_pass=false \
            -Ddt.detector.original_order.retry_count=3 -Dmaven.test.failure.ignore=true \
            -DfailIfNoTests=false -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true 2>&1 | tee logs/idflakies_log

      - name: Archive iDFlakies Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idflakies-results-${{ inputs.repo_name }}-${{ inputs.sha }}
          path: |
            **/run_metadata.json
            **/.dtfixingtools/**
          include-hidden-files: true
          retention-days: 7

      - name: Archive iDFlakies Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idflakies_logs_${{ inputs.repo_name }}
          path: '**/logs/idflakies_log'
          retention-days: 7
