name: Dynamic Flaky Test Detection Pipeline
on:
  workflow_dispatch:
    inputs:
      max_projects:
        description: 'Maximum number of projects to run (leave empty for all)'
        required: false
        default: '5'
      offset:
        description: 'Starting row index in pr-data.csv (0-based)'
        required: false
        default: '0'
      max_job_timeout:
        description: 'Maximum time limit per detection job in minutes (e.g., 15, 30)'
        required: false
        default: '20'
      force_java_version:
        description: 'Force one JDK (8, 11 or 17) for every project. Leave empty to auto-detect per project.'
        required: false
        default: ''
      idflakies_java9plus:
        description: 'Also run iDFlakies on projects that resolve to Java 11/17 (disable if it proves unreliable there)'
        required: false
        type: boolean
        default: true

jobs:
  prepare:
    name: Generate Dynamic Matrix from IDoFT
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Dependencies
        run: pip install pandas
      - name: Generate Matrix JSON
        id: set-matrix
        env:
          MAX_RUNS: ${{ github.event.inputs.max_projects }}
          OFFSET: ${{ github.event.inputs.offset }}
        run: python .github/scripts/generate_matrix.py >> $GITHUB_OUTPUT

  # ==========================================
  # STEP 1: RUN NONDEX
  # ==========================================
  run_nondex:
    name: NonDex - ${{ matrix.repo_name }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/nondex.yml
    with:
      repo_slug: ${{ matrix.repo_slug }}
      sha: ${{ matrix.sha }}
      module_path: ${{ matrix.module_path }}
      repo_name: ${{ matrix.repo_name }}
      repo_url: ${{ matrix.repo_url }}
      force_java_version: ${{ inputs.force_java_version }}

  # ==========================================
  # STEP 2: RUN FLAKESYNC
  # ==========================================
  run_flakesync:
    name: FlakeSync - ${{ matrix.repo_name }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/flakesync.yml
    with:
      repo_slug: ${{ matrix.repo_slug }}
      sha: ${{ matrix.sha }}
      module_path: ${{ matrix.module_path }}
      repo_name: ${{ matrix.repo_name }}
      repo_url: ${{ matrix.repo_url }}
      test_names: ${{ matrix.test_names }}
      force_java_version: ${{ inputs.force_java_version }}

  # ==========================================
  # STEP 3: RUN IDFLAKIES
  # ==========================================
  run_idflakies:
    name: iDFlakies - ${{ matrix.repo_name }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/idflakies.yml
    with:
      repo_slug: ${{ matrix.repo_slug }}
      sha: ${{ matrix.sha }}
      module_path: ${{ matrix.module_path }}
      repo_name: ${{ matrix.repo_name }}
      repo_url: ${{ matrix.repo_url }}
      max_job_timeout: ${{ inputs.max_job_timeout != '' && inputs.max_job_timeout || '20' }}
      force_java_version: ${{ inputs.force_java_version }}
      idflakies_java9plus: ${{ inputs.idflakies_java9plus }}

  # ==========================================
  # STEP 4: COMBINED UNIFIED ARCHIVAL & AGGREGATION
  # ==========================================
  aggregate:
    name: Aggregate CSVs
    needs: [run_idflakies, run_nondex, run_flakesync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Pandas
        run: pip install pandas
        
      - name: Download Tool Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Run Aggregator Script
        run: python .github/scripts/aggregate_results.py

      - name: Organize Artifacts into Folders
        run: |
          # Create main tool folders
          mkdir -p idflakies nondex flakesync
          
          # Move Summary Files
          mv idflakies_summary.csv idflakies/ 2>/dev/null || true
          mv nondex_summary.csv nondex/ 2>/dev/null || true
          mv flakesync_td_tests.csv flakesync/ 2>/dev/null || true
          
          # Use 'find' to flatten and copy logs directly next to the CSVs
          find artifacts -type f -path "*/idflakies_logs_*/*" -exec cp {} idflakies/ \; || true
          find artifacts -type f -path "*/nondex_logs_*/*" -exec cp {} nondex/ \; || true
          find artifacts -type f -path "*/flakesync_logs_*/*" -exec cp {} flakesync/ \; || true
        
      - name: Upload Organized Summaries and Logs
        uses: actions/upload-artifact@v4
        with:
          name: aggregated_summaries
          path: |
            idflakies/
            nondex/
            flakesync/
          retention-days: 7

  # ==========================================
  # STEP 5: COMPARE WITH IDOFT DATASET
  # ==========================================
  compare:
    name: Compare with IDoFT Dataset
    needs: aggregate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Pandas
        run: pip install pandas

      - name: Download Aggregated Summaries
        uses: actions/download-artifact@v4
        with:
          name: aggregated_summaries
          path: .
          
      - name: Download Latest IDoFT Dataset (pr-data.csv)
        run: curl -sSL https://raw.githubusercontent.com/TestingResearchIllinois/idoft/main/pr-data.csv -o pr-data.csv
        
      - name: Compare with IDoFT Dataset
        run: python .github/scripts/compare_idoft.py
        
      - name: Upload Unique Flaky Tests Report
        uses: actions/upload-artifact@v4
        with:
          name: unique_tests_report
          path: unique_tests.txt
          retention-days: 7
