name: Dynamic Flaky Test Detection Pipeline
on:
  workflow_dispatch:
    inputs:
      max_projects:
        description: 'Maximum number of projects to run (leave empty for all)'
        required: false
        default: '5'
      offset:
        description: 'Starting row index in pr-data.csv (0-based)'
        required: false
        default: '0'
      max_job_timeout:
        description: 'Maximum time limit per detection job in minutes (e.g., 15, 30)'
        required: false
        default: '20'
      force_java_version:
        description: 'Force one JDK (8, 11 or 17) for every project. Leave empty to auto-detect per project.'
        required: false
        default: ''
      idflakies_java9plus:
        description: 'Also run iDFlakies on projects that resolve to Java 11/17 (disable if it proves unreliable there)'
        required: false
        type: boolean
        default: true

jobs:
  prepare:
    name: Generate Dynamic Matrix from IDoFT
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install pandas

      - name: Generate Matrix JSON
        id: set-matrix
        env:
          MAX_RUNS: ${{ github.event.inputs.max_projects }}
          OFFSET: ${{ github.event.inputs.offset }}
        run: python .github/scripts/generate_matrix.py >> $GITHUB_OUTPUT

  detect:
    name: ${{ matrix.repo_name }} (${{ matrix.sha }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.max_job_timeout != '' && fromJson(github.event.inputs.max_job_timeout) || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Start Job Clock
        run: |
          JOB_TIMEOUT=${{ github.event.inputs.max_job_timeout != '' && github.event.inputs.max_job_timeout || 20 }}
          # keep 4 minutes in reserve so the archive/upload step can still run
          echo "JOB_DEADLINE=$(( $(date +%s) + JOB_TIMEOUT * 60 - 240 ))" >> "$GITHUB_ENV"

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_slug }}
          ref: ${{ matrix.sha }}

      # Pipeline scripts live in this repo, but the target repo owns the workspace root,
      # so fetch them into a hidden sub-folder.
      - name: Checkout Pipeline Scripts
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Detect Required Java Version
        id: detect-java
        env:
          FORCE_JAVA_VERSION: ${{ github.event.inputs.force_java_version }}
        run: python3 .pipeline-tools/.github/scripts/detect_java_version.py "${{ matrix.module_path }}"

      # Detection tools are always BUILT with JDK 8 (their own build target); the
      # project under test is then built/tested with the detected JDK below.
      - name: Set up JDK 8 (build detection tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '8'

      # ==========================================================
      # STRATEGY 1: CONFIGURE CLEAN OFFICIAL REPOSITORY FALLBACKS
      # ==========================================================
      - name: Configure Clean Global Maven Repositories
        run: |
          rm -rf ~/.m2
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>fallback-snapshots-profile</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>apache-snapshots-repo</id>
                    <url>https://repository.apache.org/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                  <repository>
                    <id>ossrh-snapshots-repo</id>
                    <url>https://oss.sonatype.org/content/repositories/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>apache-plugin-snapshots-repo</id>
                    <url>https://repository.apache.org/snapshots/</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>false</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
          </settings>
          EOF

      # ==========================================================
      # BUILD AND INSTALL IDFLAKIES MAVEN PLUGIN LOCALLY
      # ==========================================================
      - name: Checkout iDFlakies Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/iDFlakies
          path: idflakies-repo

      - name: Build and Install iDFlakies Plugin Locally
        run: |
          cd idflakies-repo
          mvn clean install -DskipTests -B

      - name: Checkout FlakeSync Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/FlakeSync
          path: flakesync-repo

      - name: Build FlakeSync Plugin Locally
        run: |
          cd flakesync-repo
          mvn clean install -U -DskipTests -B

      # ==========================================================
      # SWITCH TO THE JDK THE PROJECT UNDER TEST NEEDS (8 / 11 / 17)
      # ==========================================================
      - name: Set up Project JDK (${{ steps.detect-java.outputs.java_version }})
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ steps.detect-java.outputs.java_version }}

      # ==========================================================
      # FORCE ROOT INSTALL PASS FOR MULTI-MODULE BOMs
      # ==========================================================
      - name: Force Global Dependency & Multi-Module Local Resolution
        continue-on-error: true
        run: |
          echo "=== INSTALLING ROOT & PARENT POMS TO LOCAL M2 ==="
          mvn clean install -B -U -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          
          if [ "${{ matrix.module_path }}" != "." ]; then
            echo "=== PRE-BUILDING TARGET SUBMODULE: ${{ matrix.module_path }} ==="
            cd ${{ matrix.module_path }}
            mvn test-compile -B -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          fi

      - name: Save Run Metadata & Pre-create Output Directories
        run: |
          mkdir -p .output_metadata .dtfixingtools .nondex
          mkdir -p ${{ matrix.module_path }}/.output_metadata ${{ matrix.module_path }}/.dtfixingtools ${{ matrix.module_path }}/.nondex

          touch .dtfixingtools/.keep .nondex/.keep
          touch ${{ matrix.module_path }}/.dtfixingtools/.keep ${{ matrix.module_path }}/.nondex/.keep

          cat <<EOF > .output_metadata/run_metadata.json
          {
            "github_url": "${{ matrix.repo_url }}",
            "sha": "${{ matrix.sha }}",
            "module_path": "${{ matrix.module_path }}",
            "java_version": "${{ steps.detect-java.outputs.java_version }}"
          }
          EOF

          if [ "${{ matrix.module_path }}" != "." ]; then
            cp .output_metadata/run_metadata.json ${{ matrix.module_path }}/.output_metadata/run_metadata.json
          fi

  # ==========================================
  # STEP 1: RUN NONDEX
  # ==========================================
  run_nondex:
    name: NonDex - ${{ matrix.repo_name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/nondex.yml
    with:
      repo_slug: ${{ matrix.repo_slug }}
      sha: ${{ matrix.sha }}
      module_path: ${{ matrix.module_path }}
      repo_name: ${{ matrix.repo_name }}
      repo_url: ${{ matrix.repo_url }}
      force_java_version: ${{ inputs.force_java_version }}
      max_job_timeout: ${{ inputs.max_job_timeout != '' && inputs.max_job_timeout || '20' }}

  # ==========================================
  # STEP 2: RUN FLAKESYNC
  # ==========================================
  run_flakesync:
    name: FlakeSync - ${{ matrix.repo_name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/flakesync.yml
    with:
      repo_slug: ${{ matrix.repo_slug }}
      sha: ${{ matrix.sha }}
      module_path: ${{ matrix.module_path }}
      repo_name: ${{ matrix.repo_name }}
      repo_url: ${{ matrix.repo_url }}
      test_names: ${{ matrix.test_names }}
      force_java_version: ${{ inputs.force_java_version }}
      max_job_timeout: ${{ inputs.max_job_timeout != '' && inputs.max_job_timeout || '20' }}

  # ==========================================
  # STEP 3: RUN IDFLAKIES
  # ==========================================
  run_idflakies:
    name: iDFlakies - ${{ matrix.repo_name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/idflakies.yml
    with:
      repo_slug: ${{ matrix.repo_slug }}
      sha: ${{ matrix.sha }}
      module_path: ${{ matrix.module_path }}
      repo_name: ${{ matrix.repo_name }}
      repo_url: ${{ matrix.repo_url }}
      max_job_timeout: ${{ inputs.max_job_timeout != '' && inputs.max_job_timeout || '20' }}
      force_java_version: ${{ inputs.force_java_version }}
      idflakies_java9plus: ${{ inputs.idflakies_java9plus }}

  # ==========================================
  # STEP 4: COMBINED UNIFIED ARCHIVAL & AGGREGATION
  # ==========================================
  aggregate:
    name: Aggregate CSVs
    needs: [run_idflakies, run_nondex, run_flakesync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Pandas
        run: pip install pandas
        
      - name: Download Tool Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Run Aggregator Script
        run: python .github/scripts/aggregate_results.py

      - name: Organize Artifacts into Folders
        run: |
          # 1. Create the master folders with subfolders for each tool
          mkdir -p Logs/idflakies Logs/nondex Logs/flakesync
          mkdir -p Results/idflakies Results/nondex Results/flakesync

          # 2. Move entire uniquely-named result directories into the tool folders
          mv artifacts/*idflakies-results* Results/idflakies/ 2>/dev/null || true
          mv artifacts/*nondex-results* Results/nondex/ 2>/dev/null || true
          mv artifacts/*flakesync-results* Results/flakesync/ 2>/dev/null || true
          
          # 3. Move entire uniquely-named log directories into the tool folders
          mv artifacts/*idflakies_logs_* Logs/idflakies/ 2>/dev/null || true
          mv artifacts/*nondex_logs_* Logs/nondex/ 2>/dev/null || true
          mv artifacts/*flakesync_logs_* Logs/flakesync/ 2>/dev/null || true

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: Logs
          path: Logs/
          retention-days: 7

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: Results
          path: Results/
          retention-days: 7

      - name: Upload Aggregated Summary CSVs
        uses: actions/upload-artifact@v4
        with:
          name: aggregated_summaries
          path: |
            idflakies_summary.csv
            nondex_summary.csv
            flakesync_td_tests.csv
          retention-days: 7

  # ==========================================
  # STEP 5: COMPARE WITH IDOFT DATASET
  # ==========================================
  compare:
    name: Compare with IDoFT Dataset
    needs: aggregate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Pandas
        run: pip install pandas

      - name: Download Aggregated Summaries
        uses: actions/download-artifact@v4
        with:
          name: aggregated_summaries
          path: .
          
      - name: Download Latest IDoFT Dataset (pr-data.csv)
        run: curl -sSL https://raw.githubusercontent.com/TestingResearchIllinois/idoft/main/pr-data.csv -o pr-data.csv
        
      - name: Compare with IDoFT Dataset
        run: python .github/scripts/compare_idoft.py
        
      - name: Upload Unique Flaky Tests Report
        uses: actions/upload-artifact@v4
        with:
          name: unique_tests_report
          path: unique_tests.txt
          retention-days: 7
