name: Run FlakeSync
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      test_names:
        required: false
        type: string
      force_java_version:
        required: false
        type: string
      max_job_timeout:
        required: true
        type: string

jobs:
  flakesync:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      - name: Checkout Pipeline Scripts
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: |
            .github/scripts
            .github/actions
          sparse-checkout-cone-mode: false

      # Builds the FlakeSync plugin (replaces the old checkout + build steps here)
      - name: Setup Project Under Test
        id: setup
        uses: ./.pipeline-tools/.github/actions/setup-project
        with:
          repo_slug: ${{ inputs.repo_slug }}
          sha: ${{ inputs.sha }}
          module_path: ${{ inputs.module_path }}
          repo_url: ${{ inputs.repo_url }}
          force_java_version: ${{ inputs.force_java_version }}
          max_job_timeout: ${{ inputs.max_job_timeout }}
          build_idflakies: 'false'
          build_flakesync: 'true'

      - name: Run FlakeSync
        continue-on-error: true
        run: |
          cd ${{ inputs.module_path }}
          mkdir -p logs
          unset MAVEN_OPTS
          mvn test-compile -q -B -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
          
          mvn edu.utdallas.cs:flakesync-maven-plugin:1.0.0-SNAPSHOT:detect \
            -B -Dmaven.test.failure.ignore=true -DfailIfNoTests=false \
            -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true 2>&1 | tee logs/flakesync_log.txt || true

      - name: Archive FlakeSync Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakesync-results-${{ inputs.repo_name }}-${{ inputs.sha }}
          path: |
            **/run_metadata.json
            **/.flakesync/**
          include-hidden-files: true
          retention-days: 7

      - name: Archive FlakeSync Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakesync_logs_${{ inputs.repo_name }}
          path: '**/logs/flakesync_log.txt'
          retention-days: 7
