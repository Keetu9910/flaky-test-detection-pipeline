name: Run FlakeSync
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      test_names: 
        required: false
        type: string
      force_java_version:
        required: false
        type: string
      max_job_timeout:       
        required: true       
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}
          
      - name: Checkout FlakeSync Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/FlakeSync
          path: flakesync-repo

      - name: Build FlakeSync Plugin Locally
        run: |
          cd flakesync-repo
          export JAVA_HOME=$JAVA_HOME_8_X64
          export PATH=$JAVA_HOME/bin:$PATH
          mvn clean install -U -DskipTests

      - name: Save Run Metadata
        run: |
          mkdir -p .output_metadata
          cat <<EOF > .output_metadata/run_metadata.json
          {"github_url": "${{ inputs.repo_url }}", "sha": "${{ inputs.sha }}", "module_path": "${{ inputs.module_path }}"}
          EOF
          if [ "${{ inputs.module_path }}" != "." ]; then
            mkdir -p ${{ inputs.module_path }}/.output_metadata
            cp .output_metadata/run_metadata.json ${{ inputs.module_path }}/.output_metadata/run_metadata.json
          fi

      - name: Run FlakeSync
        continue-on-error: true
        run: |
          cd ${{ inputs.module_path }}
          mkdir -p logs
          
          export JAVA_HOME=$JAVA_HOME_8_X64
          export PATH=$JAVA_HOME/bin:$PATH
          TEST_NAMES="${{ inputs.test_names }}"
          
          if [ -n "$TEST_NAMES" ]; then
            IFS=',' read -ra ADDR <<< "$TEST_NAMES"
            for TEST_NAME in "${ADDR[@]}"; do
              echo "=== Running FlakeSync on $TEST_NAME ===" 2>&1 | tee -a >(grep -iE "error|flaky|fail|exception" >> logs/flakesync_filtered.log)
              
              mvn edu.utexas.ece:flakesync-maven-plugin:1.0-SNAPSHOT:concurrentfind \
                -Dflakesync.testName="$TEST_NAME" -B -Dcheckstyle.skip=true -Drat.skip=true 2>&1 | tee -a >(grep -iE "error|flaky|fail|exception" >> logs/flakesync_filtered.log)
                
              mvn edu.utexas.ece:flakesync-maven-plugin:1.0-SNAPSHOT:delaylocs \
                -Dflakesync.testName="$TEST_NAME" -B -Dcheckstyle.skip=true -Drat.skip=true 2>&1 | tee -a >(grep -iE "error|flaky|fail|exception" >> logs/flakesync_filtered.log)
            done
          else
            echo "Warning: No test names provided in matrix to run FlakeSync."
          fi

      - name: Archive FlakeSync Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakesync-results-${{ inputs.repo_name }}-${{ inputs.sha }}
          path: |
            **/run_metadata.json
            **/.flakesync/**
            **/failing-test-output*/**
          include-hidden-files: true
          retention-days: 7

      - name: Archive FlakeSync Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakesync_logs_${{ inputs.repo_name }}
          path: '**/logs/flakesync_filtered.log'
          retention-days: 7
