name: Run FlakeSync
on:
  workflow_call:
    inputs:
      repo_slug:
        required: true
        type: string
      sha:
        required: true
        type: string
      module_path:
        required: true
        type: string
      repo_name:
        required: true
        type: string
      repo_url:
        required: true
        type: string
      test_names:
        required: false
        type: string
      force_java_version:
        required: false
        type: string
      max_job_timeout:
        required: true
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.max_job_timeout) }}
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_slug }}
          ref: ${{ inputs.sha }}

      # The target repo owns the workspace root, so the shared actions live in a hidden sub-folder.
      - name: Checkout Pipeline Actions
        uses: actions/checkout@v4
        with:
          path: .pipeline-tools
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Checkout FlakeSync Repository
        uses: actions/checkout@v4
        with:
          repository: UT-SE-Research/FlakeSync
          path: flakesync-repo

      - name: Build FlakeSync Plugin Locally
        run: |
          cd flakesync-repo
          export JAVA_HOME=$JAVA_HOME_8_X64
          export PATH=$JAVA_HOME/bin:$PATH
          mvn clean install -U -DskipTests

      - name: Save Run Metadata
        uses: ./.pipeline-tools/.github/actions/save-metadata
        with:
          repo-url: ${{ inputs.repo_url }}
          sha: ${{ inputs.sha }}
          module-path: ${{ inputs.module_path }}

      - name: Run FlakeSync
        continue-on-error: true
        uses: ./.pipeline-tools/.github/actions/run-detector
        with:
          tool: flakesync
          module-path: ${{ inputs.module_path }}
          mvn-args: edu.utdallas.cs:flakesync-maven-plugin:1.0.0-SNAPSHOT:detect

      - name: Archive FlakeSync Results and Logs
        if: always()
        uses: ./.pipeline-tools/.github/actions/archive-results
        with:
          tool: flakesync
          repo-name: ${{ inputs.repo_name }}
          sha: ${{ inputs.sha }}
          results-glob: '**/.flakesync/**'
