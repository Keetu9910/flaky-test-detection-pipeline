name: Setup Project Under Test
description: Detects the Java version, builds the detection plugins, and pre-installs dependencies for the project under test

inputs:
  repo_slug:
    description: Target repository (owner/name)
    required: true
  sha:
    description: Commit SHA of the target repository
    required: true
  module_path:
    description: Module path inside the target repo ('.' for root)
    required: true
  repo_url:
    description: Full URL of the target repository
    required: true
  force_java_version:
    description: Force one JDK (8, 11 or 17). Empty means auto-detect.
    required: false
    default: ''
  max_job_timeout:
    description: Job timeout in minutes (used to compute the reserve deadline)
    required: false
    default: '20'
  build_idflakies:
    description: Build and install the iDFlakies plugin ('true' or 'false')
    required: false
    default: 'true'
  build_flakesync:
    description: Build and install the FlakeSync plugin ('true' or 'false')
    required: false
    default: 'true'

outputs:
  java_version:
    description: JDK version that was detected (or forced) for the project
    value: ${{ steps.detect-java.outputs.java_version }}

runs:
  using: composite
  steps:
    - name: Start Job Clock
      shell: bash
      env:
        JOB_TIMEOUT: ${{ inputs.max_job_timeout }}
      run: |
        # keep 4 minutes in reserve so the archive/upload step can still run
        echo "JOB_DEADLINE=$(( $(date +%s) + JOB_TIMEOUT * 60 - 240 ))" >> "$GITHUB_ENV"

    - name: Detect Required Java Version
      id: detect-java
      shell: bash
      env:
        FORCE_JAVA_VERSION: ${{ inputs.force_java_version }}
        MODULE_PATH: ${{ inputs.module_path }}
      run: python3 .pipeline-tools/.github/scripts/detect_java_version.py "$MODULE_PATH"

    # Detection tools are always BUILT with JDK 8; the project under test
    # is then built/tested with the detected JDK further down.
    - name: Set up JDK 8 (build detection tools)
      uses: actions/setup-java@v4
      with:
        distribution: corretto
        java-version: '8'

    - name: Configure Clean Global Maven Repositories
      shell: bash
      run: |
        rm -rf ~/.m2
        mkdir -p ~/.m2
        cat <<EOF > ~/.m2/settings.xml
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <profiles>
            <profile>
              <id>fallback-snapshots-profile</id>
              <activation>
                <activeByDefault>true</activeByDefault>
              </activation>
              <repositories>
                <repository>
                  <id>apache-snapshots-repo</id>
                  <url>https://repository.apache.org/snapshots/</url>
                  <snapshots><enabled>true</enabled></snapshots>
                  <releases><enabled>false</enabled></releases>
                </repository>
                <repository>
                  <id>ossrh-snapshots-repo</id>
                  <url>https://oss.sonatype.org/content/repositories/snapshots/</url>
                  <snapshots><enabled>true</enabled></snapshots>
                  <releases><enabled>false</enabled></releases>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>apache-plugin-snapshots-repo</id>
                  <url>https://repository.apache.org/snapshots/</url>
                  <snapshots><enabled>true</enabled></snapshots>
                  <releases><enabled>false</enabled></releases>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
        </settings>
        EOF

    - name: Checkout iDFlakies Repository
      if: inputs.build_idflakies == 'true'
      uses: actions/checkout@v4
      with:
        repository: UT-SE-Research/iDFlakies
        path: idflakies-repo

    - name: Build and Install iDFlakies Plugin Locally
      if: inputs.build_idflakies == 'true'
      shell: bash
      run: |
        cd idflakies-repo
        mvn clean install -DskipTests -B

    - name: Checkout FlakeSync Repository
      if: inputs.build_flakesync == 'true'
      uses: actions/checkout@v4
      with:
        repository: UT-SE-Research/FlakeSync
        path: flakesync-repo

    - name: Build FlakeSync Plugin Locally
      if: inputs.build_flakesync == 'true'
      shell: bash
      run: |
        cd flakesync-repo
        mvn clean install -U -DskipTests -B

    # Switch to the JDK the project under test needs (8 / 11 / 17)
    - name: Report Detected Java Version
      shell: bash
      env:
        JAVA_VERSION: ${{ steps.detect-java.outputs.java_version }}
      run: |
        echo "::notice title=Java version::${{ inputs.repo_slug }} resolved to JDK $JAVA_VERSION"
        echo "Detected JDK $JAVA_VERSION for ${{ inputs.repo_slug }}" >> "$GITHUB_STEP_SUMMARY"

    - name: Set up Project JDK (${{ steps.detect-java.outputs.java_version }})
      id: setup-java
      uses: actions/setup-java@v4
      with:
        distribution: corretto
        java-version: ${{ steps.detect-java.outputs.java_version }}

    - name: Force Global Dependency & Multi-Module Local Resolution
      shell: bash
      continue-on-error: true
      env:
        MODULE_PATH: ${{ inputs.module_path }}
      run: |
        echo "=== INSTALLING ROOT & PARENT POMS TO LOCAL M2 ==="
        mvn clean install -B -U -DskipTests -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true

        if [ "$MODULE_PATH" != "." ]; then
          echo "=== PRE-BUILDING TARGET SUBMODULE: $MODULE_PATH ==="
          cd "$MODULE_PATH"
          mvn test-compile -B -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true || true
        fi

    - name: Save Run Metadata & Pre-create Output Directories
      shell: bash
      env:
        MODULE_PATH: ${{ inputs.module_path }}
        REPO_URL: ${{ inputs.repo_url }}
        SHA: ${{ inputs.sha }}
        JAVA_VERSION: ${{ steps.detect-java.outputs.java_version }}
      run: |
        mkdir -p .output_metadata .dtfixingtools .nondex
        mkdir -p "$MODULE_PATH/.output_metadata" "$MODULE_PATH/.dtfixingtools" "$MODULE_PATH/.nondex"

        touch .dtfixingtools/.keep .nondex/.keep
        touch "$MODULE_PATH/.dtfixingtools/.keep" "$MODULE_PATH/.nondex/.keep"

        cat <<EOF > .output_metadata/run_metadata.json
        {
          "github_url": "$REPO_URL",
          "sha": "$SHA",
          "module_path": "$MODULE_PATH",
          "java_version": "$JAVA_VERSION"
        }
        EOF

        if [ "$MODULE_PATH" != "." ]; then
          cp .output_metadata/run_metadata.json "$MODULE_PATH/.output_metadata/run_metadata.json"
        fi
